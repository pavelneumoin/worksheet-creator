# docker compose -f compose.yaml -f compose.https.yaml up -d --wait
services:
  https:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      MAX_APP_URL: ${MAX_APP_URL:?Set MAX_APP_URL to the public HTTPS origin}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      listok: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 20s
      timeout: 5s
      retries: 3
    mem_limit: 256m

volumes:
  caddy_data:
  caddy_config:
