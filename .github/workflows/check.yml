name: Check ListOK build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build Python and TeX image
        run: docker build -t listok:night7 .
      - name: Offline regression tests
        run: docker run --rm --network none listok:night7 python -m unittest discover -s tests -v
      - name: Real PDFs and durable queue without AI credentials
        run: |
          docker run --rm --network none listok:night7 python scripts/smoke_pdf.py
          docker run --rm --network none listok:night7 python scripts/smoke_queue.py
          docker run --rm --network none listok:night7 python scripts/smoke_analytics.py
          docker run --rm --network none listok:night7 python scripts/smoke_answer_forms.py
          docker run --rm --network none listok:night7 python scripts/smoke_typography.py
      - name: Four CMU templates, page totals and print catalogue
        run: |
          docker run --name print-samples --network none listok:night7 python scripts/check_templates.py
          docker cp print-samples:/app/output/pdf ./print-samples
          docker rm print-samples
      - uses: actions/upload-artifact@v4
        with:
          name: listok-print-samples
          path: print-samples/*.pdf
          retention-days: 90
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Parse exported Marp with the real renderer
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/frontend_requests.test.cjs tests/frontend_downloads.test.cjs tests/frontend_roster.test.cjs tests/frontend_review_focus.test.cjs tests/frontend_batch_queue.test.cjs
          for file in app/frontend/*.js; do node --check "$file"; done
          docker run --name marp-samples --network none listok:night7 python scripts/prepare_marp_samples.py
          docker cp marp-samples:/app/output ./output
          docker rm marp-samples
          LISTOK_SKIP_MARP_SAMPLES=1 npm run check:marp
      - name: Start all services with test credentials and persistent volumes
        run: |
          cp .env.example .env
          printf '\nMAX_BOT_TOKEN=ci-only-token\nMAX_APP_URL=https://listok.test\n' >> .env
          mkdir -p .local-certs
          docker compose -f compose.yaml -f compose.https.yaml config --quiet
          docker run --rm -e MAX_APP_URL=https://listok.test -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile
          docker compose up -d --wait --wait-timeout 120
          curl --fail http://127.0.0.1:3005/api/status
          curl --fail http://127.0.0.1:3005/api/health/ready
          docker compose exec -T listok python scripts/smoke_deployment.py
          docker compose restart listok
          docker compose up -d --wait --wait-timeout 120
          docker compose exec -T listok python scripts/smoke_deployment.py
      - name: Start the MAX webhook worker without sending messages
        run: |
          printf '\nMAX_BOT_USERNAME=ci_fixture_bot\nMAX_WEBHOOK_SECRET=ci-only-webhook-secret-32-characters-long\n' >> .env
          docker compose -f compose.yaml -f compose.bot.yaml config --quiet
          docker compose -f compose.yaml -f compose.bot.yaml up -d --wait --wait-timeout 120
          curl --fail http://127.0.0.1:3005/api/health/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3005/api/max/webhook -H 'Content-Type: application/json' -d '{}')" = 403
      - name: Container diagnostics
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail 80
      - name: Export the verified Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker save listok:night7 | gzip > listok-image.tar.gz
          sha256sum listok-image.tar.gz > listok-image.sha256
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: listok-docker-image
          path: |
            listok-image.tar.gz
            listok-image.sha256
          compression-level: 0
          retention-days: 90
      - name: Stop the CI deployment
        if: always()
        run: docker compose -f compose.yaml -f compose.bot.yaml down --volumes --remove-orphans
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/listok-')
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: listok-docker-image
      - name: Publish the verified image for the competition reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check listok-image.sha256
          gh release create "$GITHUB_REF_NAME" listok-image.tar.gz listok-image.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --verify-tag --title "ЛистОК — $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
