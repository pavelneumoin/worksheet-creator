<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ListOK · редактор формул</title>
<link rel="stylesheet" href="../app/frontend/style.css"><link rel="stylesheet" href="../app/frontend/studio.css"><link rel="stylesheet" href="../app/frontend/refinement.css"><link rel="stylesheet" href="../app/frontend/workspace.css"><link rel="stylesheet" href="../app/frontend/vendor/katex/katex-swap.min.css"><link rel="stylesheet" href="../app/frontend/vendor/astryx/listok-ui.css">
<style>body{padding:24px;max-width:900px;margin:auto;background:#f6f7fb}.preview-card{background:#fff;padding:20px;border:1px solid #e6e5ee;border-radius:18px}textarea{width:100%;min-height:100px}h1{font-size:20px;margin:0 0 18px}.creation-variants{margin-top:22px;max-width:240px}#verification{font-size:12px;white-space:pre-wrap;margin-top:20px}</style>
</head><body><div class="preview-card"><h1>Текст заданий</h1><textarea id="sourceText" maxlength="16000">Решите уравнение: </textarea><div id="latexKeyboard"></div><div class="creation-variants"><label class="variant-count">Количество вариантов<select id="setupVariants"><option value="1">Один</option><option value="2">Два</option><option value="3">Три</option><option value="4">Четыре</option></select></label></div><div id="verification" role="status"></div></div>
<script>window.$=id=>document.getElementById(id);window.uiErrors=[];addEventListener('error',event=>uiErrors.push(event.message));</script><script src="../app/frontend/vendor/katex/katex.min.js"></script><script src="../app/frontend/latex_keyboard.js"></script><script src="../app/frontend/vendor/astryx/listok-ui.js"></script>
<script>setTimeout(()=>{document.querySelector('[aria-label="Дробь"]')?.click();setTimeout(()=>{document.getElementById('verification').textContent=JSON.stringify({mounted:!!document.querySelector('.astryx-button'),inputs:document.querySelectorAll('#latexKeyboard input').length,variantHidden:document.getElementById('setupVariants').hidden,overflow:document.documentElement.scrollWidth>innerWidth,errors:uiErrors})},100)},600)</script></body></html>
